# Раз в сутки:
#   1) пингует Supabase, чтобы бесплатный проект не уснул от неактивности;
#   2) раз в 50 дней делает пустой коммит, иначе GitHub сам выключает расписание
#      в репозиториях без активности (через 60 дней).
#
# Секреты не нужны: адрес и публичный ключ берутся из config.js (они и так открыты).
# Вечерняя сводка в Telegram (23:00 МСК) запускается внутри самой Supabase (pg_cron), не здесь.
#
# Проверить вручную: вкладка Actions -> Daily ping -> Run workflow.

name: Daily ping

on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'key: *"[^"]*"' config.js | sed 's/key: *"//; s/"$//')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::В config.js нет адреса или ключа Supabase"; exit 1; fi
          for i in 1 2 3; do
            if curl -sS --fail-with-body --max-time 30 -X POST "$URL/rest/v1/rpc/ping" \
                 -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'; then
              echo ""; echo "Supabase отвечает"; exit 0
            fi
            echo "Попытка $i не удалась, жду 20 секунд"; sleep 20
          done
          echo "::error::Supabase не отвечает. Возможно, проект на паузе: откройте supabase.com и нажмите Restore."
          exit 1

      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Дней с последнего коммита: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: расписание не засыпает"
            git push
          fi
